name: CI

on:
  pull_request:
  push:
    branches: [main, 'preview/**']
  # Lets the roadmap-sync job start this check on its own pull requests;
  # PRs opened with GITHUB_TOKEN do not trigger pull_request workflows.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Client generation and the hosted app need no privileged connection URL.
      DATABASE_URL: ""
      DIRECT_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
      # Offline build/smoke coverage must never depend on account credentials.
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:offline
      - name: Install Chromium for offline browser checks
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile production smoke
        run: npm run test:e2e:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: offline-browser-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
