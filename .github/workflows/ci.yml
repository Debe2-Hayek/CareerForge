name: CI

on:
  pull_request:
  push:
    branches: [main, 'preview/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Client generation and the hosted app need no privileged connection URL.
      DATABASE_URL: ""
      DIRECT_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
      # Offline build/smoke coverage must never depend on account credentials.
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:offline
      - name: Install Chromium for offline browser checks
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile production smoke
        run: npm run test:e2e:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: offline-browser-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
