name: Free roadmap sync

on:
  schedule:
    - cron: "31 3 * * 1"
  workflow_dispatch:

concurrency:
  group: free-roadmap-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    name: Sync roadmap.sh without AI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Synchronize upstream and repository evidence
        run: npm run sync:roadmap
        env:
          ROADMAP_GITHUB_TOKEN: ${{ github.token }}

      - name: Refuse changes outside the roadmap document
        shell: bash
        run: |
          unexpected="$(git status --porcelain --untracked-files=all | grep -vE '^.. src/data/roadmap\.json$' || true)"
          if test -n "$unexpected"; then
            echo "The zero-token sync changed files outside src/data/roadmap.json:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check -- src/data/roadmap.json

      # main is protected (PR + approval + CI), so the sync proposes its change
      # for human review instead of pushing to main.
      - name: Propose the roadmap document for review when it changed
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: chore/roadmap-sync
        run: |
          if git diff --quiet -- src/data/roadmap.json; then
            echo "Roadmap is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$SYNC_BRANCH"
          git add -- src/data/roadmap.json
          git commit -m "chore(roadmap): sync free upstream snapshot"
          # The bot owns this branch; each run replaces it with the newest snapshot.
          git push --force origin "HEAD:refs/heads/$SYNC_BRANCH"
          open_pr="$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if test -z "$open_pr"; then
            gh pr create --base main --head "$SYNC_BRANCH" \
              --title "chore(roadmap): sync free upstream snapshot" \
              --body "Automated zero-token roadmap.sh sync. Only src/data/roadmap.json changed; upstream discoveries stay upstream-new until reviewed. This PR never auto-merges."
          fi
          # Dispatch the required CI verify check, because PRs opened with
          # GITHUB_TOKEN do not start pull_request workflows.
          gh workflow run ci.yml --ref "$SYNC_BRANCH"
